<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Batalha RPG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs (Versão Compat/Namespace) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        cardBg: '#131b2e',
                        cardBorder: '#1e293b',
                        accentBlue: '#38bdf8',
                        accentPurple: '#a855f7',
                        accentRed: '#ef4444',
                        accentGold: '#f59e0b',
                        accentGreen: '#10b981',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        
        body {
            background-color: #080c14;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(168, 85, 247, 0.15), transparent 40%),
                radial-gradient(circle at 10% 30%, rgba(56, 189, 248, 0.08), transparent 30%),
                radial-gradient(circle at 90% 70%, rgba(239, 68, 68, 0.08), transparent 30%);
            min-height: 100vh;
        }

        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-8px, 5px) rotate(-2deg); }
            40% { transform: translate(8px, -5px) rotate(2deg); }
            60% { transform: translate(-5px, 3px) rotate(-1deg); }
            80% { transform: translate(5px, -3px) rotate(1deg); }
        }

        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes flashRed {
            0% { filter: brightness(1) drop-shadow(0 0 0px rgba(239, 68, 68, 0)); }
            50% { filter: brightness(2) drop-shadow(0 0 25px rgba(239, 68, 68, 1)); background-color: rgba(239, 68, 68, 0.3); }
            100% { filter: brightness(1) drop-shadow(0 0 0px rgba(239, 68, 68, 0)); }
        }

        .animate-hit {
            animation: flashRed 0.4s ease-out;
        }

        @keyframes flashGreen {
            0% { filter: brightness(1) drop-shadow(0 0 0px rgba(16, 185, 129, 0)); }
            50% { filter: brightness(1.5) drop-shadow(0 0 25px rgba(16, 185, 129, 0.8)); background-color: rgba(16, 185, 129, 0.25); }
            100% { filter: brightness(1) drop-shadow(0 0 0px rgba(16, 185, 129, 0)); }
        }

        .animate-heal {
            animation: flashGreen 0.5s ease-out;
        }

        /* Animação de Consumo de Ki Máximo */
        @keyframes kiRelease {
            0% { filter: brightness(1) drop-shadow(0 0 0px rgba(245, 158, 11, 0)); transform: scale(1); }
            50% { filter: brightness(2.5) drop-shadow(0 0 35px rgba(245, 158, 11, 1)); transform: scale(1.02); }
            100% { filter: brightness(1) drop-shadow(0 0 0px rgba(245, 158, 11, 0)); transform: scale(1); }
        }

        .animate-ki-release {
            animation: kiRelease 0.6s ease-out;
        }

        @keyframes floatUpFade {
            0% { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
            20% { opacity: 1; transform: translate(-50%, -20px) scale(1.3); }
            80% { opacity: 1; transform: translate(-50%, -50px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -70px) scale(0.8); }
        }

        .floating-damage {
            position: absolute;
            left: 50%;
            top: 30%;
            transform: translate(-50%, 0);
            pointer-events: none;
            animation: floatUpFade 1.2s ease-out forwards;
            z-index: 50;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 2px 4px rgba(0,0,0,1);
        }

        .floating-heal {
            position: absolute;
            left: 50%;
            top: 30%;
            transform: translate(-50%, 0);
            pointer-events: none;
            animation: floatUpFade 1.2s ease-out forwards;
            z-index: 50;
            font-weight: 900;
            color: #34d399;
            text-shadow: 0 0 12px rgba(16, 185, 129, 0.9), 0 2px 4px rgba(0,0,0,1);
        }

        .hp-bar-fill, .ki-bar-fill {
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0d1322;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body class="p-3 sm:p-6 text-slate-200">

                    <i class="fa-solid font-black fa-swords text-2xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-2xl sm:text-3xl font-black bg-gradient-to-r from-blue-400 via-purple-400 to-red-400 bg-clip-text text-transparent">
                        Dragon Ball All-Time
                    </h1>
                    <div class="flex items-center gap-2">
                        <p class="text-xs text-slate-400">Calculadora de Batalha</p>
                        <span id="sync-status" class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full font-bold">
                            🟢 Conectado ao Firebase

                    </div>
                </div>
            </div>

            <!-- Contador de Turno -->
            <div class="flex items-center gap-4 bg-slate-950/80 px-5 py-2.5 rounded-xl border border-slate-800">
                <button onclick="changeTurn(-1)" class="w-9 h-9 flex items-center justify-center bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-lg transition active:scale-95">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <div class="text-center min-w-[90px]">
                    <span class="text-xs uppercase tracking-widest text-slate-500 font-bold block">Turno</span>
                    <span id="turn-display" class="text-2xl font-black text-purple-400">1</span>
                </div>
                <button onclick="changeTurn(1)" class="w-9 h-9 flex items-center justify-center bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-lg transition active:scale-95">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <!-- Ações Globais -->
            <div class="flex items-center gap-2">
                <button onclick="healAll()" class="flex items-center gap-2 px-4 py-2.5 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 rounded-xl font-semibold text-sm transition active:scale-95">
                    <i class="fa-solid fa-heart-pulse"></i> Restaurar Todos HPs

                </button>
            </div>
        </header>

            <div class="flex items-center justify-between">
                <h2 class="text-xl font-bold text-slate-200 flex items-center gap-2">

            skillDmg: 100,
            crit: false,
            img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRt8OSFTAqhaBjCBiw5_EkLGTDCzBxmTUpgISQybFGJMliYU7Y1kxoSDATb&s=10"
        };

        let turn = 1;
        let party = JSON.parse(JSON.stringify(defaultParty));
        let enemy = JSON.parse(JSON.stringify(defaultEnemy));
        let isFirstLoad = true;

        // --- SINCRONIZAÇÃO COM FIREBASE ---
        stateRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                turn = data.turn ?? 1;
                party = data.party ?? party;
                enemy = data.enemy ?? enemy;
                
                if (isFirstLoad) {
                    renderPartyCards();
                    isFirstLoad = false;
                }
                updateUIFromState();
            } else {
                saveStateToFirebase();
            }
        });

        function saveStateToFirebase() {
            stateRef.set({
                turn: turn,
                party: party,
                enemy: enemy
            });
        }

        function syncPlayerProp(idx, prop, val) {
            if (prop === 'name') party[idx].name = val;
            else if (prop === 'crit' || prop === 'evade') party[idx][prop] = val;
            else {
                party[idx][prop] = parseFloat(val) || 0;
                if (prop === 'hpMax') party[idx].currentHp = Math.min(party[idx].currentHp, party[idx].hpMax);
            }
            db.ref(`battleState/party/${idx}`).set(party[idx]);
        }

        // Alteração de Ki progressivo (0 a 20)
        function adjustPlayerKi(idx, delta) {
            const currentKi = Number(party[idx].ki) || 0;
            const newKi = Math.max(0, Math.min(MAX_KI, currentKi + delta));
            party[idx].ki = newKi;
            db.ref(`battleState/party/${idx}/ki`).set(newKi);
        }

        function setPlayerKiDirect(idx, val) {
            const newKi = Math.max(0, Math.min(MAX_KI, Number(val) || 0));
            party[idx].ki = newKi;
            db.ref(`battleState/party/${idx}/ki`).set(newKi);
        }

        function updateEnemyProp(prop, val) {
            if (prop === 'name' || prop === 'img') enemy[prop] = val;
            else if (prop === 'crit') enemy[prop] = val;
            else {
                enemy[prop] = parseFloat(val) || 0;
                if (prop === 'maxHp') enemy.currentHp = Math.min(enemy.currentHp, enemy.maxHp);
            }
            db.ref('battleState/enemy').set(enemy);
        }

        function updateUIFromState() {
            document.getElementById('turn-display').innerText = turn;

            // Inimigo
            document.getElementById('enemy-name').value = enemy.name || 'Nome';
            document.getElementById('enemy-img').src = enemy.img;
            document.getElementById('enemy-max-hp').value = enemy.maxHp;
            document.getElementById('enemy-atk').value = enemy.atk;
            document.getElementById('enemy-bonus-atk').value = enemy.atkBonus;
            document.getElementById('enemy-dom-atk').value = enemy.atkDom;
            document.getElementById('enemy-def').value = enemy.def;
            document.getElementById('enemy-bonus-def').value = enemy.defBonus;
            document.getElementById('enemy-dom-def').value = enemy.defDom;
            document.getElementById('enemy-dmg-red').value = enemy.dmgRed;
            document.getElementById('enemy-skill-dmg').value = enemy.skillDmg;
            document.getElementById('enemy-crit').checked = enemy.crit;

            const enemyStats = calcEnemyStats();
            document.getElementById('enemy-total-atk').innerText = enemyStats.totalAtk;
            document.getElementById('enemy-total-def').innerText = enemyStats.totalDef;
            const enemyHpPercent = Math.max(0, Math.min(100, (enemy.currentHp / enemy.maxHp) * 100));
            document.getElementById('enemy-hp-bar').style.width = enemyHpPercent + '%';
            document.getElementById('enemy-hp-text').innerText = `${Math.round(enemy.currentHp)} / ${enemy.maxHp}`;

            // Jogadores
            party.forEach((p, idx) => {
                const card = document.getElementById(`player-card-${p.id}`);
                if (card) {
                    const stats = calcPlayerStats(p);
                    card.querySelector('.total-atk-display').innerText = stats.totalAtk;
                    card.querySelector('.total-def-display').innerText = stats.totalDef;
                    const hpPercent = Math.max(0, Math.min(100, (p.currentHp / p.hpMax) * 100));
                    card.querySelector('.hp-text-display').innerText = `${Math.round(p.currentHp)} / ${p.hpMax}`;
                    card.querySelector('.hp-bar-fill').style.width = `${hpPercent}%`;
                    card.querySelector('.player-avatar-img').src = p.img;

                    // Atualizar Barra de Ki Gradual (0 a 20)
                    const kiVal = Number(p.ki) || 0;
                    const kiInput = card.querySelector('.ki-input-field');
                    if (kiInput && document.activeElement !== kiInput) {
                        kiInput.value = kiVal;
                    }

                    const kiBarFill = card.querySelector('.ki-bar-fill');
                    const kiPercent = Math.max(0, Math.min(100, (kiVal / MAX_KI) * 100));
                    kiBarFill.style.width = `${kiPercent}%`;

                    if (kiVal >= MAX_KI) {
                        kiBarFill.className = 'ki-bar-fill h-full bg-gradient-to-r from-amber-400 to-yellow-300 rounded-full shadow-lg shadow-amber-400/80';
                    } else {
                        kiBarFill.className = 'ki-bar-fill h-full bg-gradient-to-r from-sky-500 to-blue-400 rounded-full shadow-lg shadow-sky-500/50';
                    }
                }
            });
        }

        function calcPlayerStats(p) {
            const atkBaseWithBonus = p.atk + (p.atk * (p.atkBonus / 100));
            const atkCat = 1 + (p.atkCat / 100);
            const atkDom = 1 + (p.atkDom / 100);
            let totalAtk = (atkBaseWithBonus * atkCat) * atkDom;
            if (p.crit) totalAtk *= 1.5;

            const defBaseWithBonus = p.def + (p.def * (p.defBonus / 100));
            const defCat = 1 + (p.defCat / 100);
            const defDom = 1 + (p.defDom / 100);
            const totalDef = (defBaseWithBonus * defCat) * defDom;

            return { totalAtk: Math.round(totalAtk), totalDef: Math.round(totalDef) };
        }

        function calcEnemyStats() {
            let totalAtk = (enemy.atk + (enemy.atk * (enemy.atkBonus / 100))) * (1 + (enemy.atkDom / 100));
            if (enemy.crit) totalAtk *= 1.5;
            let totalDef = (enemy.def + (enemy.def * (enemy.defBonus / 100))) * (1 + (enemy.defDom / 100));
            return { totalAtk: Math.round(totalAtk), totalDef: Math.round(totalDef) };
        }

        // --- TROCA DE IMAGENS ---
        function handleEnemyFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    updateEnemyProp('img', e.target.result);
                    addLog(`🖼️ Imagem do Inimigo alterada.`);
                };
                reader.readAsDataURL(file);
            }
        }

        function promptEnemyImageURL() {
            const url = prompt("Cole a URL da imagem para o Inimigo:", enemy.img);
            if (url && url.trim() !== "") {
                updateEnemyProp('img', url.trim());
                addLog(`🖼️ Imagem do Inimigo alterada.`);
            }
        }

        function handlePlayerFileUpload(idx, event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    syncPlayerProp(idx, 'img', e.target.result);
                    addLog(`🖼️ Imagem de <b>${party[idx].name}</b> alterada.`);
                };
                reader.readAsDataURL(file);
            }
        }

        function promptPlayerImageURL(idx) {
            const url = prompt(`Cole a URL da imagem para ${party[idx].name}:`, party[idx].img);
            if (url && url.trim() !== "") {
                syncPlayerProp(idx, 'img', url.trim());
                addLog(`🖼️ Imagem de <b>${party[idx].name}</b> alterada.`);
            }
        }

        // --- AÇÕES DE JOGO ---
        function healEnemy() {
            const pct = parseFloat(document.getElementById('enemy-heal-pct').value) || 0;
            if (pct <= 0) return;

            const healAmount = Math.round(enemy.maxHp * (pct / 100));
            const oldHp = enemy.currentHp;
            enemy.currentHp = Math.min(enemy.maxHp, enemy.currentHp + healAmount);
            const actualHeal = Math.round(enemy.currentHp - oldHp);

            updateEnemyProp('currentHp', enemy.currentHp);
            triggerHealVisual('enemy-card', actualHeal);
            addLog(`💚 <b>${enemy.name}</b> recuperou <span class="text-emerald-400 font-bold">+${actualHeal} HP</span>.`);
        }

        function healPlayer(idx) {
            const p = party[idx];
            const pct = parseFloat(p.healPct) || 0;
            if (pct <= 0) return;

            const healAmount = Math.round(p.hpMax * (pct / 100));
            const oldHp = p.currentHp;
            p.currentHp = Math.min(p.hpMax, p.currentHp + healAmount);
            const actualHeal = Math.round(p.currentHp - oldHp);

            syncPlayerProp(idx, 'currentHp', p.currentHp);
            triggerHealVisual(`player-card-${p.id}`, actualHeal);
            addLog(`💚 <b>${p.name}</b> recuperou <span class="text-emerald-400 font-bold">+${actualHeal} HP</span>.`);
        }

        function playerAttack(playerIdx) {
            const p = party[playerIdx];
            const pStats = calcPlayerStats(p);
            const enemyStats = calcEnemyStats();

            const rawDmg = (pStats.totalAtk * (p.skillDmg / 100)) - enemyStats.totalDef;
            const reducedDmg = rawDmg * (1 - (enemy.dmgRed / 100));
            const finalDamage = Math.max(1, Math.round(reducedDmg));

            enemy.currentHp = Math.max(0, enemy.currentHp - finalDamage);

            updateEnemyProp('currentHp', enemy.currentHp);
            triggerDamageVisual('enemy-card', finalDamage, p.crit);

            // Verificação de Consumo de Ki Máximo
            const currentKi = Number(p.ki) || 0;
            if (currentKi >= MAX_KI) {
                p.ki = 0;
                db.ref(`battleState/party/${playerIdx}/ki`).set(0);
                triggerKiReleaseVisual(`player-card-${p.id}`);
                addLog(`🔥 <b>${p.name}</b> LIBEROU TODO O KI (20/20) NO ATAQUE! Ki resetado para 0.`);
            }

            addLog(`⚔️ <b>${p.name}</b> atacou <b>${enemy.name}</b> causando <span class="text-red-400 font-bold">${finalDamage}</span> de dano! ${p.crit ? '<span class="text-amber-400 font-bold">(CRÍTICO!)</span>' : ''}`);
        }

        function enemyAttackArea() {
            const enemyStats = calcEnemyStats();
            addLog(`<span class="text-red-400 font-bold">💥 ${enemy.name} executou um Ataque em Área!</span>`);

            party.forEach((p, idx) => {
                if (p.evade) {
                    triggerDamageVisual(`player-card-${p.id}`, 0, false, true);
                    addLog(`↳ <b>${p.name}</b> <span class="text-blue-400 font-bold">ESQUIVOU</span>!`);
                } else {
                    const pStats = calcPlayerStats(p);
                    const rawDmg = (enemyStats.totalAtk * (enemy.skillDmg / 100)) - pStats.totalDef;
                    const reducedDmg = rawDmg * (1 - (p.dmgRed / 100));
                    const finalDamage = Math.max(1, Math.round(reducedDmg));

                    p.currentHp = Math.max(0, p.currentHp - finalDamage);
                    syncPlayerProp(idx, 'currentHp', p.currentHp);
                    triggerDamageVisual(`player-card-${p.id}`, finalDamage, enemy.crit);
                    addLog(`↳ <b>${p.name}</b> recebeu <span class="text-red-400 font-bold">${finalDamage}</span> de dano.`);
                }
            });
        }

        function changeTurn(delta) {
            turn = Math.max(1, turn + delta);
            db.ref('battleState/turn').set(turn);
            addLog(`<span class="text-purple-400 font-bold">--- AVANÇOU PARA O TURNO ${turn} ---</span>`);
        }

        function healAll() {
            enemy.currentHp = enemy.maxHp;
            party.forEach(p => p.currentHp = p.hpMax);
            saveStateToFirebase();
            addLog(`<span class="text-emerald-400 font-bold">✨ Todos os HPs foram totalmente restaurados!</span>`);
        }

        function resetStats() {
            party = JSON.parse(JSON.stringify(defaultParty));
            enemy = JSON.parse(JSON.stringify(defaultEnemy));
            turn = 1;
            saveStateToFirebase();
            renderPartyCards();
            addLog(`<span class="text-slate-400 italic">O estado da batalha foi totalmente resetado no Firebase.</span>`);
        }

                                    <input type="number" value="${p.defCat}" oninput="syncPlayerProp(${idx}, 'defCat', this.value)" class="w-full bg-slate-900 border border-slate-700/60 rounded px-1.5 py-0.5 text-slate-200 font-mono">
                                </div>
                                <div class="bg-slate-950/40 p-1.5 rounded border border-slate-800/50">
                                    <label class="text-slate-400 block font-semibold">Dom. DEF %</label>
                                    <input type="number" value="${p.defDom}" oninput="syncPlayerProp(${idx}, 'defDom', this.value)" class="w-full bg-slate-900 border border-slate-700/60 rounded px-1.5 py-0.5 text-slate-200 font-mono">
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        // --- VISUAIS ---
        function triggerDamageVisual(elementId, damageValue, isCritical = false, isEvaded = false) {
            const el = document.getElementById(elementId);
            if (!el) return;

            el.classList.remove('animate-shake', 'animate-hit');
            void el.offsetWidth;

            if (!isEvaded) el.classList.add('animate-shake', 'animate-hit');

            const floatNum = document.createElement('div');
            if (isEvaded) {
                floatNum.className = `floating-damage text-blue-400 text-2xl`;
                floatNum.innerHTML = `ESQUIVOU!`;
            } else {
                floatNum.className = `floating-damage ${isCritical ? 'text-amber-400 text-3xl' : 'text-red-500 text-2xl'}`;
                floatNum.innerHTML = `${isCritical ? '⚡ CRÍTICO! ' : ''}-${damageValue}`;
            }

            el.appendChild(floatNum);
            setTimeout(() => { floatNum.remove(); }, 1200);
        }

        function triggerHealVisual(elementId, healValue) {
            const el = document.getElementById(elementId);
            if (!el) return;

            el.classList.remove('animate-heal');
            void el.offsetWidth;
            el.classList.add('animate-heal');

            const floatNum = document.createElement('div');
            floatNum.className = `floating-heal text-2xl`;
            floatNum.innerHTML = `+${healValue} HP`;

            el.appendChild(floatNum);
            setTimeout(() => { floatNum.remove(); }, 1200);
        }

        function triggerKiReleaseVisual(elementId) {
            const el = document.getElementById(elementId);
            if (!el) return;

            el.classList.remove('animate-ki-release');
            void el.offsetWidth;
            el.classList.add('animate-ki-release');
        }

        function addLog(message) {
            const logBox = document.getElementById('battle-log');
            const time = new Date().toLocaleTimeString('pt-BR', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const entry = document.createElement('div');
            entry.className = "py-0.5 border-b border-slate-800/40 last:border-0";
            entry.innerHTML = `<span class="text-slate-500">[${time}]</span> ${message}`;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function clearLog() {
            document.getElementById('battle-log').innerHTML = '<div class="text-slate-500 italic">Log limpo.</div>';
        }
    </script>
</body>
</html>
